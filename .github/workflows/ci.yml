name: Python CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  test:
    name: pytest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record tested revision
        shell: bash
        run: |
          echo "Checkout HEAD: $(git rev-parse HEAD)"
          echo "Event GITHUB_SHA: $GITHUB_SHA"
          echo "Event name: $GITHUB_EVENT_NAME"
          echo "PR source head: ${{ github.event.pull_request.head.sha }}"
          python --version
          python -m pip --version

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run full test suite
        run: python -m pytest -q
