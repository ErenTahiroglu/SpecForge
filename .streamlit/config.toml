# Streamlit's own upload limit, "2" megabytes. Observed once: Brave on macOS with Streamlit 1.67.0 refused a file of 2,000,001
# bytes and accepted 2,000,000 bytes. That is not a statement about every browser: the installed frontend picks its megabyte
# base from the platform (offline: 2,097,152 bytes for a Windows platform string), and a real Windows browser run was not
# verified. Streamlit's server-side check uses 2 MiB plus multipart framing. The application keeps its own exact guard of
# 2,000,000 bytes for uploaded files (app/ingest.py: MAX_FILE_BYTES, error code FILE_TOO_LARGE).
[server]
maxUploadSize = 2

# Local runs only. Streamlit Community Cloud forces gatherUsageStats = true and ignores this value.
[browser]
gatherUsageStats = false
